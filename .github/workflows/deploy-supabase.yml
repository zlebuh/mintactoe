name: Deploy Supabase (DB + Edge Functions)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v2

      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - run: supabase db push

      # Edge functions import packages/game-engine/dist (built output), not src —
      # the deployed edge-runtime can't resolve the source layout.
      - run: pnpm --filter @mintactoe/game-engine build

      - run: supabase functions deploy
